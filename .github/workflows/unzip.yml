name: Auto Unzip File

on: [push]

jobs:
  unzip:
    runs-on: ubuntu-latest
    
    # MEMBERIKAN IZIN AKSES MENULIS/PUSH KE REPO
    permissions:
      contents: write

    steps:
      # 1. Mengunduh isi repositori ke server
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Mengekstrak menggunakan perintah bawaan Linux (lebih stabil)
      - name: Extract ZIP File
        run: |
          unzip -o screener_sqlite.zip -d .
          rm screener_sqlite.zip

      # 3. Menyimpan kembali (Push) hasil ekstrak ke repositori Anda
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Otomatis ekstrak screener_sqlite.zip" || echo "Tidak ada perubahan"
          git push origin HEAD
