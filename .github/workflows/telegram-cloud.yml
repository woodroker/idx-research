name: Telegram stock screener (Cloudflare D1)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Tes Telegram atau jalankan satu sesi"
        type: choice
        options:
          - test
          - d1-check
          - morning
          - afternoon
        default: test
        required: true
  schedule:
    # 08:20 and 13:20 Jakarta time (UTC+7), weekdays.
    - cron: "20 1 * * 1-5"
    - cron: "20 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: telegram-screener-cloud-db
  cancel-in-progress: false

jobs:
  telegram-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SCREENER_D1_API_URL: ${{ secrets.SCREENER_D1_API_URL }}
      SCREENER_D1_API_TOKEN: ${{ secrets.SCREENER_D1_API_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCREENER_TELEGRAM_WIB_WINDOW: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pkg/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r pkg/requirements.txt
      - name: Verify D1 after repository update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "pkg")
          import database
          conn = database.connect()
          try:
              for table in ("shared_datasets", "shared_records", "fundamentals_cache", "telegram_outbox"):
                  count = conn.execute("SELECT COUNT(*) FROM " + table).fetchone()[0]
                  print("D1 %s: %s rows" % (table, count))
          finally:
              conn.close()
          PY
      - name: Test Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'test'
        run: python pkg/telegram_worker.py --test
      - name: Check Cloudflare D1 (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'd1-check'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "pkg")
          import database
          conn = database.connect()
          try:
              for table in ("shared_datasets", "shared_records", "fundamentals_cache", "alert_log", "telegram_outbox"):
                  count = conn.execute("SELECT COUNT(*) FROM " + table).fetchone()[0]
                  print("D1 %s: %s rows" % (table, count))
          finally:
              conn.close()
          PY
      - name: Run manual morning session
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'morning'
        run: python pkg/telegram_worker.py --window morning
      - name: Run manual afternoon session
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'afternoon'
        run: python pkg/telegram_worker.py --window afternoon
      - name: Run morning session
        if: github.event.schedule == '20 1 * * 1-5'
        run: python pkg/telegram_worker.py --window morning
      - name: Run afternoon session
        if: github.event.schedule == '20 6 * * 1-5'
        run: python pkg/telegram_worker.py --window afternoon
